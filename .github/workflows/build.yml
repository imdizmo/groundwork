name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build editor/Desktop/Groundwork.Desktop.csproj -c Release
      - name: Core tests
        run: dotnet test --project editor/tests/Core.Tests/Core.Tests.csproj -c Release
      - name: Desktop tests
        run: xvfb-run -a dotnet test --project editor/tests/Desktop.Tests/Desktop.Tests.csproj -c Release
